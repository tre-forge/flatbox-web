<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>flatbox</title>
<style>
body{margin:0;background:linear-gradient(180deg,#070A12,#11162B);color:#EAF0FF;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden;}
.wrap{padding:70px 16px 110px;min-height:100vh;}
.stage{height:720px;max-width:1120px;margin:0 auto;perspective:900px;transform-style:preserve-3d;position:relative;}
camera{transform:translateZ(320px) rotateX(16deg);transform-style:preserve-3d;}
.layer{position:absolute;left:50%;width:min(1050px,100%);transform-style:preserve-3d;}
.shell{border-radius:22px;border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 60px rgba(0,0,0,.45);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.12));overflow:hidden;}
.hero{padding:26px 30px;}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:20px 30px 30px;}
.card{height:122px;border-radius:18px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);padding:14px;}
@media(max-width:900px){.grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<main class="wrap">
<section class="stage">
<div class="camera">
<div class="layer" data-depth="0.12" data-base="translateX(-50%) translateY(-30px) translateZ(-380px) rotateZ(2deg)"><div class="shell" style="height:380px;opacity:.6;"></div></div>
<div class="layer" data-depth="0.06" data-base="translateX(-50%) translateY(-150px) translateZ(-150px)"><div class="shell"><div class="hero"><h1>flatbox</h1><p>Camera is higher on the Z axis.</p></div></div></div>
<div class="layer" data-depth="0.10" data-base="translateX(-50%) translateY(-20px) translateZ(-280px)"><div class="shell"><div class="grid"><div class="card">hover</div><div class="card">parallax</div><div class="card">mini-world</div></div></div></div>
</div>
</section>
<footer style="color:rgba(255,255,255,.55);text-align:center;max-width:1120px;margin:56px auto 0;">Prototype direction.</footer>
</main>
<script>
(function(){
var layers=[].slice.call(document.querySelectorAll('[data-depth]'));
var tx=0,ty=0,ttx=0,tty=0;
function lerp(a,b,t){return a+(b-a)*t;}
function tick(){
tx=lerp(tx,ttx,.08);
ty=lerp(ty,tty,.08);
layers.forEach(function(layer){
var d=parseFloat(layer.dataset.depth||'0');
var base=layer.dataset.base||'';
layer.style.transform=base+' translateX('+tx*d*-0.9+'px) translateY('+ty*d*-0.7+'px)';
});
requestAnimationFrame(tick);
}
function move(e){
var nx=(e.clientX/window.innerWidth-0.5)*2;
var ny=(e.clientY/window.innerHeight-0.5)*2;
ttx=nx*18;
tty=ny*12;
}
window.addEventListener('pointermove',move);
tick();
})();
</script>
</body>
</html>
